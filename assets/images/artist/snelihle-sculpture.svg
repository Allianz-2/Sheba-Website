<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="sculptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1715"/>
      <stop offset="100%" stop-color="#2a231e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#sculptBg)"/>
  
  <!-- Pedestal / Plinth -->
  <polygon points="120,620 480,620 450,680 150,680" fill="#120e0d"/>
  
  <!-- Suspended sheep hide installation -->
  <path d="M200,80 L400,80" stroke="#c99738" stroke-width="2"/>
  <line x1="240" y1="80" x2="220" y2="200" stroke="#b85d38" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="80" x2="380" y2="200" stroke="#b85d38" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <!-- Organic hide forms -->
  <path d="M190,210 C140,260 170,380 210,430 C260,490 230,570 280,600 C320,580 300,480 360,440 C420,400 450,280 400,210 C350,230 250,220 190,210 Z" fill="#e4d5c3" stroke="#aa8d73" stroke-width="3"/>
  
  <!-- Stitches and cultural markings -->
  <path d="M220,270 Q300,310 370,270" stroke="#8c2d19" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <path d="M240,340 Q300,390 350,340" stroke="#8c2d19" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <path d="M260,420 Q300,460 340,420" stroke="#8c2d19" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <circle cx="300" cy="330" r="45" fill="#c99738" opacity="0.3"/>
  
  <text x="300" y="650" font-family="'Playfair Display', serif" font-size="18" fill="#e8dacb" text-anchor="middle" font-style="italic">Umnikelo (Offering)</text>
  <text x="300" y="675" font-family="'Inter', sans-serif" font-size="12" fill="#a89a8c" text-anchor="middle">Cured Sheep Hide, Waxed Thread &amp; Ash (2024)</text>
</svg>